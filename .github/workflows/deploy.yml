name: Deploy - Backend (Render)

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'render.yaml'
      - 'Dockerfile'

jobs:
  render:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    steps:
    - name: Hit Render deploy hook
      run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
      env:
        RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}