type User {
  id: ID!
  email: String!
  name: String!
  createdAt: String!
}

type AuthPayload {
  user: User!
  token: String!
}

type Exercise {
  id: ID!
  name: String!
  description: String
  muscleGroup: MuscleGroup!
  equipment: EquipmentType!
  thumbnailUrl: String
  imageStart: String
  imagePeak: String
  imageMain: String
  isCustom: Boolean!
  category: String
  difficulty: String
  primaryMuscles: [String!]!
  secondaryMuscles: [String!]!
  goals: [String!]!
  tags: [String!]!
  met: Float
  isUnilateral: Boolean!
  isBodyweight: Boolean!
  instructionsEn: [String!]!
  instructionsDe: [String!]!
  instructionsEs: [String!]!
  tipsEn: [String!]!
  tipsDe: [String!]!
  tipsEs: [String!]!
}

enum MuscleGroup {
  Chest
  Back
  Legs
  Shoulders
  Arms
  Core
  Cardio
  FullBody
  Other
}

enum EquipmentType {
  Barbell
  Dumbbell
  Machine
  Bodyweight
  Cable
  Kettlebell
  Band
  Other
}

type Query {
  me: User!
  exercises(
    muscleGroup: MuscleGroup
    equipment: EquipmentType
    search: String
    difficulty: String
    category: String
    limit: Int
    offset: Int
  ): [Exercise!]!
  exercise(id: ID!): Exercise
  exerciseByDatasetId(datasetId: String!): Exercise
}

type Mutation {
  register(email: String!, password: String!, name: String!): AuthPayload!
  login(email: String!, password: String!): AuthPayload!
}